[mode]

# Apply custom color mapping for better readability

# status bar
normal_main = { fg = "black", bg = "blue", bold = true }
normal_alt  = { fg = "blue", bg = "black" }

select_main = { fg = "white", bg = "blue", bold = true }
select_alt  = { fg = "blue", bg = "black" }

unset_main  = { fg = "white", bg = "magenta", bold = true }
unset_alt   = { fg = "blue", bg = "black" }


# file hover
[filetype]
rules = [
	# Image
	{ mime = "**/image/*", fg = "yellow" },
	# Media
	{ mime = "**/{audio,video}/*", fg = "magenta" },
	# Archive
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "red" },
	# Document
	{ mime = "**/application/{pdf,doc,rtf}", fg = "cyan" },
	# Virtual file system
	{ mime = "vfs/{absent,stale}", fg = "darkgray" },
	# Special file
	{ url = "*", is = "orphan", bg = "red" },
	{ url = "*", is = "exec", fg = "green" },
	{ url = "*", is = "dummy", bg = "red" },
	{ url = "*/", is = "dummy", bg = "red" },
	# Fallback
	{ url = "*/", fg = "blue" },
	{ url = "*", fg = "lightblue" },
]
