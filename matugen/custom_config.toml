# Standalone matugen config, separate from anything Dux Shell manages.

[config]

# Dux Shell
[templates.dms]
input_path = '~/dotfiles/matugen/templates/dms-theme.json'
output_path = '~/dotfiles/dux/themes/dynamic_black.json'

# Obsidian
[templates.obsidian]
input_path = '~/dotfiles/matugen/templates/obsidian.css'
output_path = '~/dotfiles/obsidian/themes/Matugen/theme.css'

# Unlayered Slicer
[templates.unlayered_slicer]
input_path = '~/dotfiles/matugen/templates/unlayered-slicer.json'
output_path = '~/dotfiles/unlayered-slicer/themes/Matugen.json'

# KiCad
[templates.kicad]
input_path = '~/dotfiles/matugen/templates/kicad.json'
output_path = '~/dotfiles/kicad/colors/Matugen.json'

# COSMIC (Cosmic Files and other libcosmic apps)
[templates.cosmic]
input_path = '~/dotfiles/matugen/templates/cosmic-theme.ron'
output_path = '~/dotfiles/cosmic/theme.ron'
post_hook = '~/dotfiles/scripts/cosmic-theme-apply.sh'
